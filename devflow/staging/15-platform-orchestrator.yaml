apiVersion: v1
kind: Secret
metadata:
  name: platform-orchestrator-config
  namespace: devflow-staging
type: Opaque
stringData:
  config.yaml: |
    server:
      port: 8090
    log:
      level: info
      format: console
    otel:
      endpoint: ""
      service_name: platform-orchestrator
    downstream:
      app_service_base_url: http://devflow-app-service:8081
      config_service_base_url: http://devflow-config-service:8082
      network_service_base_url: http://devflow-network-service:8086
      release_service_base_url: http://devflow-release-service:8083
    environments:
      - key: staging
        name: Staging
        cluster: shared-staging
        namespace: devflow-staging
        argo_url: https://argo.example.com/applications/devflow-staging
      - key: prod
        name: Production
        cluster: devflow-prod
        namespace: devflow-prod
        argo_url: https://argo.example.com/applications/devflow-prod
    pyroscope: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devflow-platform-orchestrator
  namespace: devflow-staging
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: devflow-platform-orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: devflow-platform-orchestrator
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      imagePullSecrets:
        - name: aliyun-docker-config
      containers:
        - name: devflow-platform-orchestrator
          image: registry.cn-hangzhou.aliyuncs.com/devflow/devflow-platform-orchestrator:staging
          imagePullPolicy: Always
          imagePullPolicy: Always
          ports:
            - containerPort: 8090
              name: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: config
              mountPath: /etc/devflow/config/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          secret:
            secretName: platform-orchestrator-config
---
apiVersion: v1
kind: Service
metadata:
  name: devflow-platform-orchestrator
  namespace: devflow-staging
spec:
  selector:
    app.kubernetes.io/name: devflow-platform-orchestrator
  ports:
    - name: http
      port: 8090
      targetPort: http
  type: ClusterIP
